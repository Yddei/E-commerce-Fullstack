<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Mintmade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --brand-purple: #483056; 
            --brand-light: #F9F9F9;
        }

        body {
            font-family: 'Lato', sans-serif;
            color: #333;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
        }

        .bg-brand-purple {
            background-color: var(--brand-purple);
            color: white;
        }

        .text-brand-purple {
            color: var(--brand-purple);
        }

        .btn-brand {
            background-color: var(--brand-purple);
            color: white;
            border-radius: 0;
            padding: 10px 30px;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        .btn-brand:hover {
            background-color: #2c1a36;
            color: white;
        }

        .hero-placeholder {
            background-color: #ddd;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('https://placehold.co/1920x1080/e0e0e0/999999?text=Hero+Image:+Model+in+White+Shirt');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .image-placeholder {
            background-color: #eee;
            min-height: 500px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            background-size: cover;
            background-position: center;
        }

        .content-center {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4rem;
            text-align: center;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container py-5">
        <h2 class="mb-4 text-center font-serif">Checkout</h2>
        
        <div class="row g-5">
            <div class="col-md-7">
                <div class="card p-4 border-0 shadow-sm">
                    <h4 class="mb-3">Shipping Address</h4>
                    <form id="checkout-form">
                        <div class="row g-3">
                            <div class="col-sm-6">
                                <label class="form-label">First name</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label">Last name</label>
                                <input type="text" class="form-control" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Address</label>
                                <input type="text" class="form-control" placeholder="1234 Main St" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Payment Method</label>
                                <select class="form-select">
                                    <option value="credit">Credit Card (Test Mode)</option>
                                    <option value="cod">Cash on Delivery</option>
                                </select>
                            </div>
                        </div>
                        <hr class="my-4">
                        <button class="btn btn-dark w-100 py-3 rounded-0" type="submit">PLACE ORDER</button>
                    </form>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card p-4 border-0 shadow-sm">
                    <h4 class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-muted">Your Cart</span>
                        <span class="badge bg-secondary rounded-pill" id="summary-count">0</span>
                    </h4>
                    <ul class="list-group mb-3" id="summary-list">
                        </ul>
                    <li class="list-group-item d-flex justify-content-between bg-light">
                        <strong>Total (SGD)</strong>
                        <strong id="summary-total">$0.00</strong>
                    </li>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cart = JSON.parse(localStorage.getItem('shoppingCart')) || [];
        const summaryList = document.getElementById('summary-list');
        let total = 0;

        if (cart.length === 0) {
            alert("Your cart is empty!");
            window.location.href = '/shop';
        }

        cart.forEach(item => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;
            
            summaryList.innerHTML += `
                <li class="list-group-item d-flex justify-content-between lh-sm">
                    <div>
                        <h6 class="my-0">${item.name}</h6>
                        <small class="text-muted">Qty: ${item.quantity}</small>
                    </div>
                    <span class="text-muted">$${itemTotal.toFixed(2)}</span>
                </li>
            `;
        });
        
        document.getElementById('summary-total').innerText = '$' + total.toFixed(2);
        document.getElementById('summary-count').innerText = cart.length;

        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const token = localStorage.getItem('token');
            if (!token) {
                alert("Please log in to checkout.");
                // Optionally open your login modal here if you import main.js
                return;
            }

            const payload = JSON.parse(atob(token.split('.')[1]));
            const userId = payload.userId;

            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({
                        cartItems: cart,
                        totalAmount: total
                    })
                });

                if (response.ok) {
                    alert("Order Placed Successfully!");
                    localStorage.removeItem('shoppingCart');
                    window.location.href = '/shop'; 
                } 

                else {
                    alert("Failed to place order.");
                }
            } 
            
            catch (err) {
                console.error(err);
                alert("Server error.");
            }
        });
    </script>
</body>
</html>
