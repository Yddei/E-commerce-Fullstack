<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Reviews - Mintmade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lato', sans-serif; background-color: #f8f9fa; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        .bg-brand-purple { background-color: #483056; color: white; }
        .text-warning { color: #f1c40f !important; }
        .review-card { transition: transform 0.2s; }
        .review-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand font-monospace fw-bold" href="/">MINTMADE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="/shop">Shop</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/reviews.html">Reviews</a></li>
                    <li class="nav-item ms-3"><button id="auth-btn" class="btn btn-outline-dark btn-sm rounded-0">Log In</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-4">What our customers say</h1>
            <p class="text-muted">Read genuine reviews from our community.</p>
        </div>

        <div id="review-form-container" class="row justify-content-center mb-5" style="display: none;">
            <div class="col-md-8">
                <div class="card border-0 shadow-sm p-4">
                    <h5 class="mb-3">Leave a Review</h5>
                    <form id="addReviewForm">
                        <div class="mb-3">
                            <label class="form-label small text-muted">RATING</label>
                            <div class="rating-input">
                                <select class="form-select rounded-0" id="ratingInput" required>
                                    <option value="5">★★★★★ (5 Stars)</option>
                                    <option value="4">★★★★☆ (4 Stars)</option>
                                    <option value="3">★★★☆☆ (3 Stars)</option>
                                    <option value="2">★★☆☆☆ (2 Stars)</option>
                                    <option value="1">★☆☆☆☆ (1 Star)</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">YOUR COMMENT</label>
                            <textarea class="form-control rounded-0" id="commentInput" rows="3" required placeholder="Tell us what you liked..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 rounded-0">SUBMIT REVIEW</button>
                    </form>
                </div>
            </div>
        </div>

        <div id="login-prompt" class="text-center mb-5">
            <p class="text-muted">Want to leave a review? <a href="#" data-bs-toggle="modal" data-bs-target="#loginModal">Log in here</a>.</p>
        </div>

        <div id="reviews-grid" class="row g-4">
            <div class="text-center w-100 mt-5"><div class="spinner-border" role="status"></div></div>
        </div>
    </div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
        <div id="successToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">Message</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
        <div id="errorToast" class="toast align-items-center text-white bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">Message</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/main.js"></script> 

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadReviews();
            checkAuthForReview();
        });

        // 1. Check if user is logged in
        function checkAuthForReview() {
            const token = localStorage.getItem('token');
            if (token) {
                document.getElementById('review-form-container').style.display = 'flex';
                document.getElementById('login-prompt').style.display = 'none';
            } 
            else {
                document.getElementById('review-form-container').style.display = 'none';
                document.getElementById('login-prompt').style.display = 'block';
            }
        }

        // 2. Load Reviews
        async function loadReviews() {
            try {
                const res = await fetch('/api/reviews');
                const reviews = await res.json();
                const grid = document.getElementById('reviews-grid');
                grid.innerHTML = '';

                if(reviews.length === 0) {
                    grid.innerHTML = '<div class="text-center text-muted">No reviews yet. Be the first!</div>';
                    return;
                }

                reviews.forEach(review => {
                    const stars = '★'.repeat(review.rating) + '☆'.repeat(5 - review.rating);
                    const date = new Date(review.created_at).toLocaleDateString();
                    
                    grid.innerHTML += `
                        <div class="col-md-6 col-lg-4">
                            <div class="card h-100 border-0 shadow-sm review-card p-3">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h6 class="fw-bold mb-0">${review.username}</h6>
                                    <span class="text-warning small" style="letter-spacing: 2px;">${stars}</span>
                                </div>
                                <p class="text-muted small mb-3 flex-grow-1">"${review.comment}"</p>
                                <small class="text-muted" style="font-size: 0.7rem;">Posted on ${date}</small>
                            </div>
                        </div>
                    `;
                });
            } 
            catch (err) {
                console.error(err);
            }
        }

        // 3. Submit Review
        document.getElementById('addReviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('token');
            const rating = document.getElementById('ratingInput').value;
            const comment = document.getElementById('commentInput').value;

            try {
                const res = await fetch('/api/reviews', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ rating, comment })
                });

                if (res.ok) {
                    showToast("Review posted successfully!", "success");
                    document.getElementById('addReviewForm').reset();
                    loadReviews();
                } 
                else {
                    showToast(data.message || "Failed to post review", "error");
                }
            } 
            catch (err) {
                console.error(err);
                showToast("Server error. Please try again.", "error");
            }
        });
    </script>
</body>
</html>
